name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Matches rust-version = "1.89" in Cargo.toml (rusqlite 0.42 floor).
      - name: rustc 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # python/hql reads nodes.extra with PyYAML; hql_twin shells out to it.
      - name: PyYAML for the HQL twin
        run: python3 -m pip install --user pyyaml

      # Includes hql_twin plus phase0 / cli / hql / import.
      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: Check hedron binaries
        run: test -x target/release/hedron && test -x target/release/hedron-import

      # stdlib unittest; same command as python/hql/README.md.
      - name: Python HQL twin
        working-directory: python/hql
        run: python3 -m unittest discover -s tests -v
