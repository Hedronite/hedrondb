[package]
name = "hedron-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "HedronDB Phase 0: desired state, causal event log, vault isolation"
publish = false
default-run = "hedron"

[dependencies]
# rust-version 1.89 is the floor set by rusqlite 0.42 / libsqlite3-sys 0.40
# (RUSTSEC-2026-0459 is fixed in libsqlite3-sys 0.39+). Caret ranges let
# downstream workspaces unify; Cargo.lock pins the tested versions.
blake3 = "1.8.2"
indexmap = { version = "2.7.1", features = ["std"] }
# Wall-clock America/New_York for default check_at. Not a scheduler.
jiff = "0.1.29"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
uuid = { version = "1.11", features = ["serde", "v4"] }

[dev-dependencies]
# Property tests for the lesson-ship diff.
proptest = "1.4.0"
tempfile = "3.10.1"

[[bin]]
name = "hedron"
path = "src/bin/hedron.rs"

[[bin]]
name = "hedron-import"
path = "src/bin/hedron-import.rs"
